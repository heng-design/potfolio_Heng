    <div class="contact-wrap reveal">
      <!-- ខាងឆ្វេង: ព័ត៌មាន + social -->
      <div class="contact-info">
        <p class="contact-copy">
          Have a project in mind or just want to say hi? My inbox is always
          open.
        </p>

        <ul class="contact-list">
          <li>
            <i class="fa-solid fa-envelope"></i>
            <a href="mailto:hengb731@gmail.com">hengb731@gmail.com</a>
          </li>
          <li>
            <i class="fa-solid fa-location-dot"></i>
            <span>Pouk ,Siem Raep, Cambodia</span>
          </li>
        </ul>

        <div class="social-links">
          <a href="http://t.me/BUNHENG78" target="_blank"
            rel="noopener noreferrer">

            <i class="fa-brands fa-telegram"></i>

          </a>
          <a href="https://www.facebook.com/share/1CAharf9bH/"
            target="_blank"
            rel="noopener noreferrer">

            <i class="fa-brands fa-facebook-f"></i>

          </a>
          <a
            href="https://www.linkedin.com/in/bun-heng-7b6387388?utm_source=share_via&utm_content=profile&utm_medium=member_android"
            target="_blank"
            rel="noopener noreferrer">
            <i class="fa-brands fa-linkedin-in"></i>

          </a>
          <a href="https://github.com/heng-design" target="_blank"
            rel="noopener noreferrer">
            <i class="fa-brands fa-github"></i>
          </a>
        </div>
      </div>

      <!-- ខាងស្តាំ: form -->
      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name"
            required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email"
            placeholder="you@email.com" required>
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"
            placeholder="Tell me about your project..." required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-paper-plane"></i>
          Send Message
        </button>
      </form>
    </div>
  </div>
</section>
