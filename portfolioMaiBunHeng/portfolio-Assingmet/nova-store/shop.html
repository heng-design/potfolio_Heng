<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Nova Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { navy: '#0F172A', brandBlue: '#2563EB', brandOrange: '#F97316', soft: '#F8FAFC' },
        fontFamily: { sans: ['Inter', 'sans-serif'] },
      },
    },
  };
</script>
<link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-white text-slate-900 font-sans antialiased">

<!-- ============ NAVBAR ============ -->
<header class="fixed top-0 inset-x-0 z-50 bg-white/90 backdrop-blur border-b border-slate-100">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 font-extrabold text-lg tracking-tight">
      <span class="w-8 h-8 rounded-lg bg-navy flex items-center justify-center">
        <svg class="w-4 h-4 text-brandOrange" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
      </span>
      NOVA <span class="text-brandBlue">STORE</span>
    </a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
      <a href="index.html" class="nav-link">Home</a>
      <a href="shop.html" class="nav-link active text-slate-900">Shop</a>
      <a href="index.html#categories" class="nav-link">Categories</a>
      <a href="index.html#about" class="nav-link">About</a>
      <a href="index.html#contact" class="nav-link">Contact</a>
    </nav>
    <div class="flex items-center gap-4">
      <button id="search-btn" aria-label="Search" class="text-slate-600 hover:text-brandBlue transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <a href="cart.html" aria-label="Cart" class="relative text-slate-600 hover:text-brandBlue transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>
        <span class="cart-badge hidden absolute -top-2 -right-2 bg-brandOrange text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
      </a>
      <button aria-label="Profile" class="hidden sm:flex text-slate-600 hover:text-brandBlue transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>
      </button>
      <button id="mobile-menu-btn" class="md:hidden text-slate-600" aria-label="Menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
  </div>
  <div id="mobile-menu" class="md:hidden bg-white border-t border-slate-100 px-6">
    <div class="flex flex-col py-4 gap-4 text-sm font-medium text-slate-700">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="index.html#categories">Categories</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </div>
  </div>
</header>

<!-- ============ PAGE HEADER ============ -->
<section class="pt-32 pb-12 bg-soft">
  <div class="max-w-7xl mx-auto px-6 lg:px-8">
    <p class="text-brandBlue font-semibold text-sm mb-2">CATALOG</p>
    <h1 class="text-3xl sm:text-4xl font-extrabold text-navy">Shop All Products</h1>
  </div>
</section>

<!-- ============ SHOP CONTENT ============ -->
<section class="py-12">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 grid lg:grid-cols-[240px_1fr] gap-10">

    <!-- Filters -->
    <aside class="space-y-8">
      <div>
        <label class="block text-sm font-semibold text-navy mb-2" for="search-input">Search</label>
        <div class="relative">
          <input id="search-input" type="text" placeholder="Search products..."
                 class="w-full rounded-lg border border-slate-200 pl-9 pr-3 py-2.5 text-sm focus:border-brandBlue outline-none" />
          <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        </div>
      </div>

      <div>
        <p class="text-sm font-semibold text-navy mb-3">Category</p>
        <div id="category-filters" class="space-y-2 text-sm text-slate-600">
          <button data-cat="All" class="filter-btn block w-full text-left px-3 py-2 rounded-lg hover:bg-soft transition-colors">All Products</button>
          <button data-cat="Electronics" class="filter-btn block w-full text-left px-3 py-2 rounded-lg hover:bg-soft transition-colors">Electronics</button>
          <button data-cat="Gaming" class="filter-btn block w-full text-left px-3 py-2 rounded-lg hover:bg-soft transition-colors">Gaming</button>
          <button data-cat="Accessories" class="filter-btn block w-full text-left px-3 py-2 rounded-lg hover:bg-soft transition-colors">Accessories</button>
          <button data-cat="Smart Devices" class="filter-btn block w-full text-left px-3 py-2 rounded-lg hover:bg-soft transition-colors">Smart Devices</button>
        </div>
      </div>

      <div>
        <p class="text-sm font-semibold text-navy mb-3">Sort by</p>
        <select id="sort-select" class="w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-brandBlue">
          <option value="default">Featured</option>
          <option value="price-asc">Price: Low to High</option>
          <option value="price-desc">Price: High to Low</option>
          <option value="rating">Highest Rated</option>
        </select>
      </div>
    </aside>

    <!-- Grid -->
    <div>
      <div class="flex items-center justify-between mb-6">
        <p id="results-count" class="text-sm text-slate-500"></p>
      </div>
      <div id="product-grid" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-6"></div>
      <p id="empty-state" class="hidden text-center text-slate-400 py-16">No products match your search.</p>
    </div>
  </div>
</section>

<!-- ============ FOOTER ============ -->
<footer class="bg-navy text-slate-400 border-t border-white/10 py-10">
  <div class="max-w-7xl mx-auto px-6 lg:px-8 text-center text-sm">
    © 2026 Nova Store. Portfolio project — not a real store.
  </div>
</footer>

<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-navy text-white text-sm font-medium px-5 py-3 rounded-full shadow-xl z-50 flex items-center gap-2">
  <svg class="w-4 h-4 text-green-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
  <span>Added to cart</span>
</div>

<script src="js/script.js"></script>
<script>
  const grid = document.getElementById("product-grid");
  const emptyState = document.getElementById("empty-state");
  const resultsCount = document.getElementById("results-count");
  const filterBtns = document.querySelectorAll(".filter-btn");
  const searchInput = document.getElementById("search-input");
  const sortSelect = document.getElementById("sort-select");

  const params = new URLSearchParams(window.location.search);
  let activeCategory = params.get("category") || "All";

  function setActiveFilterUI() {
    filterBtns.forEach((btn) => {
      const isActive = btn.dataset.cat === activeCategory;
      btn.classList.toggle("bg-brandBlue", isActive);
      btn.classList.toggle("text-white", isActive);
      btn.classList.toggle("font-semibold", isActive);
    });
  }

  function render() {
    let list = PRODUCTS.filter((p) => activeCategory === "All" || p.category === activeCategory);

    const q = searchInput.value.trim().toLowerCase();
    if (q) list = list.filter((p) => p.name.toLowerCase().includes(q));

    const sort = sortSelect.value;
    if (sort === "price-asc") list = [...list].sort((a, b) => a.price - b.price);
    if (sort === "price-desc") list = [...list].sort((a, b) => b.price - a.price);
    if (sort === "rating") list = [...list].sort((a, b) => b.rating - a.rating);

    grid.innerHTML = list.map(productCardHTML).join("");
    bindProductCardEvents(grid);
    resultsCount.textContent = `${list.length} product${list.length !== 1 ? "s" : ""}`;
    emptyState.classList.toggle("hidden", list.length !== 0);
    grid.classList.toggle("hidden", list.length === 0);
  }

  filterBtns.forEach((btn) => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      setActiveFilterUI();
      render();
    });
  });
  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", render);
  document.getElementById("search-btn").addEventListener("click", () => searchInput.focus());

  setActiveFilterUI();
  render();
</script>
</body>
</html>
